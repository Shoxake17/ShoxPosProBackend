name: CI/CD Pipeline - ShoxPosPro Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  # 0. Gitleaks — Maxfiy ma'lumotlarni tekshiradi
  gitleaks_scan:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 1. Semgrep — SAST
  semgrep_sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: gitleaks_scan
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Full Scan
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/javascript \
            --config=p/nodejs \
            --sarif \
            --output=semgrep.sarif \
            . || true

      - name: Check for Critical Issues
        run: |
          CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          echo "🔴 Critical Security Issues: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Kritik zaiflik topildi! Backend pipeline to'xtatiladi."
            exit 1
          fi

      - name: Upload Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # 2. Snyk — SCA (Dependency check)
  snyk_sca:
    name: SCA - Snyk
    runs-on: ubuntu-latest
    needs: semgrep_sast
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Snyk Test
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --package-manager=npm

  # 3. SonarCloud — SAST (✅ OOM xatosi to'liq hal qilindi)
  sonarcloud_sast:
    name: SAST - SonarCloud
    runs-on: ubuntu-latest
    needs: semgrep_sast
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ 1-yechim: Keraksiz fayllarni o'chirib xotirani bo'shatish
      - name: Free up disk and memory
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      # ✅ 2-yechim: node_modules ni o'rnatmaslik (faqat scan uchun kerak emas)
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # ✅ 3-yechim: JVM heap + stack + GC tuning
          SONAR_SCANNER_OPTS: >-
            -Xmx6144m
            -Xms256m
            -Xss32m
            -XX:+UseG1GC
            -XX:MaxGCPauseMillis=200
            -XX:+UseStringDeduplication
        with:
          args: >
            -Dsonar.organization=shoxake17
            -Dsonar.projectKey=Shoxake17_ShoxPosProBackend
            -Dsonar.sources=.
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.javascript.node.max_old_space_size=4096
            -Dsonar.exclusions=node_modules/**,dist/**,coverage/**,test/**,scripts/**,public/**,*.lock,package-lock.json,yarn.lock,*.min.js,*.min.css
            -Dsonar.cpd.exclusions=**/*.js,**/*.json
            -Dsonar.scm.disabled=false
            -Dsonar.qualitygate.wait=false

  # 4. Build va Push
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [semgrep_sast, sonarcloud_sast, snyk_sca]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker Image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/shoxake17/shoxposprobackend:latest
          no-cache: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/shoxake17/shoxposprobackend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to GHCR
        run: docker push ghcr.io/shoxake17/shoxposprobackend:latest

  # 5. Deploy
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.OWASP_ZAP_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/shoxpospro
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_PAT }}
            docker-compose pull backend
            docker-compose up -d --no-deps --force-recreate backend
            docker logout ghcr.io

  # 6. DAST — OWASP ZAP
  security_scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ZAP Scan
        run: |
          chmod -R 777 $GITHUB_WORKSPACE
          docker run --rm -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable \
            zap-full-scan.py -t https://shoxpospro.uz -r zap_report.html -J zap_report.json -m 5 || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-backend-reports
          path: zap_report.*

  # 7. Nuclei DAST
  nuclei_scan:
    name: DAST - Nuclei Scan
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Nuclei - Vulnerability Scan
        uses: projectdiscovery/nuclei-action@main
        with:
          target: https://shoxpospro.uz
          flags: "-severity critical,high,medium"

      - name: Upload Nuclei Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuclei-report
          path: nuclei.log