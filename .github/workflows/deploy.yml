name: CI/CD Pipeline - ShoxPosPro Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  # 0. Gitleaks — Har bir pushda maxfiy ma'lumotlarni tekshiradi
  gitleaks_scan:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  

  # 1. Semgrep — Tezkor xavfsizlik tahlili (SAST)
  semgrep_sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: gitleaks_scan
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Full Scan
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/javascript \
            --config=p/nodejs \
            --sarif \
            --output=semgrep.sarif \
            . || true

      - name: Check for Critical Issues
        run: |
          CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          echo "🔴 Critical Security Issues: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Kritik zaiflik topildi! Backend pipeline to'xtatiladi."
            exit 1
          fi

      - name: Upload Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # 2. Snyk — Open Source Vulnerability Scanner (SCA)
  snyk_sca:
    name: SCA - Snyk
    runs-on: ubuntu-latest
    needs: semgrep_sast
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Snyk Test
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --package-manager=npm

  # 3. SonarCloud — Kod sifati va chuqur tahlil (SAST)
  sonarcloud_sast:
    name: SAST - SonarCloud
    runs-on: ubuntu-latest
    needs: semgrep_sast
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: SonarCloud Scans
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=shoxake17
            -Dsonar.projectKey=Shoxake17_ShoxPosProBackend
            -Dsonar.sources=.
            -Dsonar.host.url=https://sonarcloud.io

  # 4. Build va Push (Faqat SAST bosqichlari o'tsa)
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [semgrep_sast, sonarcloud_sast, snyk_sca]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/shoxake17/shoxposprobackend:latest
          no-cache: true

  # 5. Deploy
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.OWASP_ZAP_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/shoxpospro
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_PAT }}
            docker-compose pull backend
            docker-compose up -d --no-deps --force-recreate backend
            docker logout ghcr.io

  # 6. DAST — OWASP ZAP (Tunda/Manual)
  security_scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ZAP Scan
        run: |
          chmod -R 777 $GITHUB_WORKSPACE
          docker run --rm -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable \
            zap-full-scan.py -t https://shoxpospro.uz -r zap_report.html -J zap_report.json -m 5 || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-backend-reports
          path: zap_report.*