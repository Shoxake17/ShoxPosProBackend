name: Deploy Backends

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u shoxake17 --password-stdin

      - name: Build Backend Image
        run: docker build -t ghcr.io/shoxake17/shoxposprobackend:latest .

      - name: Push Backend Image
        run: docker push ghcr.io/shoxake17/shoxposprobackend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.OWASP_ZAP_SSH_KEY }}
          script: |
            cd ~/shoxpospro
            docker-compose pull backend
            docker-compose up -d --no-deps --force-recreate backend
