name: CI/CD Pipeline - ShoxPosPro Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  # ─────────────────────────────────────────
  # 1. SAST — Har push'da ishga tushadimi
  # ─────────────────────────────────────────
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      content: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/javascript \
            --config=p/nodejs \
            --sarif \
            --output=semgrep.sarif \
            . || true

          if [ ! -f semgrep.sarif ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Semgrep","rules":[]}},"results":[]}]}' > semgrep.sarif
            echo "⚠️ semgrep.sarif yaratilmadi, bo'sh fayl ishlatilmoqda"
          else
            echo "✅ semgrep.sarif yaratildi ($(wc -c < semgrep.sarif) bytes)"
          fi

      - name: Check for Critical vulnerabilities
        run: |
          CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          HIGH=$(jq '[.runs[].results[] | select(.level == "warning")] | length' semgrep.sarif)
          echo "🔴 Critical: $CRITICAL  |  🟡 High: $HIGH"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Critical zaifliklar topildi — pipeline to'xtatildi!"
            exit 1
          fi
          echo "✅ Kritik zaiflik topilmadi."

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

      - name: Upload SAST Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-semgrep-report
          path: semgrep.sarif
          retention-days: 30

  # ─────────────────────────────────────────
  # 2. Build va Push (SAST o'tgandagina)
  # ─────────────────────────────────────────
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/shoxake17/shoxposprobackend:latest

  # ─────────────────────────────────────────
  # 3. Deploy
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.OWASP_ZAP_SSH_KEY }}
          script: |
            cd ~/shoxpospro
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_PAT }}
            docker-compose pull backend
            docker-compose up -d --no-deps --force-recreate backend
            docker logout ghcr.io

  # ─────────────────────────────────────────
  # 4. DAST — OWASP ZAP (faqat tunda/manual)
  # ─────────────────────────────────────────
  security_scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix workspace permissions
        run: chmod -R 777 $GITHUB_WORKSPACE

      - name: Run OWASP ZAP Full Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable \
            zap-full-scan.py -t https://shoxpospro.uz \
            -r zap_report.html \
            -J zap_report.json \
            -m 5 || true

      - name: Check for High Vulnerabilities
        run: |
          HIGH=$(jq '.site[0].alerts | map(select(.risk == "High")) | length' zap_report.json)
          if [ "$HIGH" -gt 0 ]; then
            echo "❌ CRITICAL: $HIGH high severity vulnerabilities found!"
            exit 1
          else
            echo "✅ No high severity vulnerabilities found."
          fi

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-reports
          path: |
            zap_report.html
            zap_report.json