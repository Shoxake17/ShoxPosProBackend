name: Security Scan

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'   # Har kuni tungi full scan

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix permissions
        run: chmod -R 777 $GITHUB_WORKSPACE

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable \
            zap-baseline.py -t https://shoxpospro.uz \
            -r zap_report.html \
            -J zap_report.json \
            -w /zap/wrk/zap.yaml \
            -m 5

      - name: Check ZAP results
        run: |
          HIGH=$(jq '.site[0].alerts | map(select(.risk == "High")) | length' zap_report.json)
          if [ "$HIGH" -gt 0 ]; then
            echo "❌ High severity vulnerabilities found!"
            exit 1
          else
            echo "✅ No high severity vulnerabilities found."
          fi

      - name: Upload ZAP HTML report
        uses: actions/upload-artifact@v4
        with:
          name: zap-html-report
          path: zap_report.html

      - name: Upload ZAP JSON report
        uses: actions/upload-artifact@v4
        with:
          name: zap-json-report
          path: zap_report.json

      - name: Upload ZAP YAML plan
        uses: actions/upload-artifact@v4
        with:
          name: zap-yaml-plan
          path: zap.yaml
