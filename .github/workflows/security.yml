name: Security Scan

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'   # Har kuni tungi full scan

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      # Kodingni checkout qilish
      - name: Checkout Code
        uses: actions/checkout@v4

      # OWASP ZAP Baseline Scan
      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw ghcr.io/zaproxy/zap2docker-stable \
            zap-baseline.py -t http://localhost:3000 \
            -r zap_report.html \
            -J zap_report.json \
            -m 5

      # High severity zaifliklarni tekshirish
      - name: Check ZAP results
        run: |
          HIGH=$(jq '.site[0].alerts | map(select(.risk == "High")) | length' zap_report.json)
          if [ "$HIGH" -gt 0 ]; then
            echo "❌ High severity vulnerabilities found!"
            exit 1
          else
            echo "✅ No high severity vulnerabilities found."
          fi

      # Reportlarni artefakt sifatida yuklash
      - name: Upload ZAP HTML report
        uses: actions/upload-artifact@v4
        with:
          name: zap-html-report
          path: zap_report.html

      - name: Upload ZAP JSON report
        uses: actions/upload-artifact@v4
        with:
          name: zap-json-report
          path: zap_report.json
