name: ShoxPosPro Backend CI/CD v1 update

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'

      - name: Dependency-larni o'rnatish
        run: npm install

      - name: Testlarni ishga tushirish
        run: npm test || echo "Testlar topilmadi, davom etamiz..."

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: SSH orqali serverga ulanish va yangilash
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/projects/ShoxPosProBackend
            git pull origin main
            npm install --production
            pm2 restart ShoxPosProBackend
