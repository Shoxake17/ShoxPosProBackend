name: Deploy ShoxPosPro v1

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    # BU YERDA ENG MUHIM O'ZGARISH!
    runs-on: self-hosted
    steps:
      - name: Kodni serverga yuklash (Checkout)
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependency-larni yangilash
        run: |
          npm install --production

      - name: Loyihani qayta ishga tushirish (PM2)
        run: |
          pm2 restart ShoxPosProBackend || pm2 start server.js --name "ShoxPosProBackend"
